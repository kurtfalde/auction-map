      sunday.setDate(sunday.getDate() + 6);
      return d >= monday && d <= sunday;
    } catch(e) { return true; }
  });

  // Remove old markers
  allMarkers.forEach(m => map.removeLayer(m));
  markers.length = 0;
  bounds.length = 0;

  const recTagMap = {"BID":"rec-tag-bid","CAUTION":"rec-tag-caution","NO BID":"rec-tag-nobid","INSUFFICIENT DATA":"rec-tag-nodata"};

  filtered.forEach((a) => {
    const icon = a.category === 'taxdeed' ? tdIcon : fcIcon;
    const m = L.marker([a.lat, a.lon], {icon}).addTo(map);
    bounds.push([a.lat, a.lon]);
    markers.push(m);
    allMarkers.push(m);
    a._marker = m;
    const catLabel = a.category === 'taxdeed' ? '<span class="cat-td">TAX DEED</span>' : '<span class="cat-fc">FORECLOSURE</span>';
    const recMap = {"BID":"rec-bid","CAUTION":"rec-caution","NO BID":"rec-nobid","INSUFFICIENT DATA":"rec-nodata"};
    const recClass = recMap[a.bid_rec] || "rec-nodata";
    const ratioStr = a.bid_ratio ? ` (${a.bid_ratio}x)` : "";
    const zestInfo = a.zestimate ? `<div class="zest-line">Zestimate: $${esc(a.zestimate.toLocaleString())}` + (a.rent_zestimate ? ` (rent $${esc(a.rent_zestimate.toLocaleString())}/mo)` : "") + `</div>` : (a.rent_zestimate ? `<div class="zest-line">Rent Zestimate: $${esc(a.rent_zestimate.toLocaleString())}/mo (est. value ~$${esc((a.rent_zestimate*110).toLocaleString())})</div>` : "");
    const bidBlock = `<span class="rec ${recClass}">${esc(a.bid_rec)}${ratioStr}</span><div class="rec-reason">${esc(a.bid_reason)}</div>${zestInfo}`;
    const popup = `<div class="popup">${catLabel}<br><b>${esc(a.address)}</b><br>${esc(a.auction_date)} ${esc(a.auction_time || '')}<br>Case: ${esc(a.case_number)}<br>Parcel: ${esc(a.parcel_id)}<br>Min bid: ${esc(a.starting_bid || a.judgment || '—')}<br>${bidBlock}<br><a target="_blank" href="${a.detail_url}">Auction</a><a target="_blank" href="${a.google_url}">Maps</a><a target="_blank" href="${a.zillow_url}">Zillow</a></div>`;
    m.bindPopup(popup);
  });

  // Rebuild list
  list.innerHTML = '';
  filtered.sort((a,b) => (a.auction_date+a.auction_time+a.address).localeCompare(b.auction_date+b.auction_time+b.address)).forEach((a) => {
    const idx = filtered.indexOf(a);
    const m = markers[idx];
    const catTag = a.category === 'taxdeed' ? '<span class="cat-tag cat-td">TD</span>' : '<span class="cat-tag cat-fc">FC</span>';
    const recTagCls = recTagMap[a.bid_rec] || "rec-tag-nodata";
    const recTagText = a.bid_rec === "BID" ? "BID" : a.bid_rec === "CAUTION" ? "CAUTION" : a.bid_rec === "NO BID" ? "NO BID" : "?";
    const recTag = `<span class="rec-tag ${recTagCls}">${recTagText}</span>`;
    const ratioStr = a.bid_ratio ? ` (${a.bid_ratio}x)` : "";
    const zestStr = a.zestimate ? 'Zestimate $' + a.zestimate.toLocaleString() : (a.rent_zestimate ? 'Rent $' + a.rent_zestimate.toLocaleString() + '/mo' : '—');
    const d = document.createElement('div'); d.className = 'item';
    d.innerHTML = `<span class="date">${esc(a.auction_date)}</span>${catTag}${recTag}<br><span class="addr">${esc(a.address)}</span><br><span class="info">Min $${esc(a.starting_bid || a.judgment || '—')} / $${zestStr}${ratioStr}</span>`;
    d.onclick = () => { map.setView([a.lat, a.lon], 16); if (a._marker) a._marker.openPopup(); };
    list.appendChild(d);
  });

  if (val === 'all') {
    listTitle.textContent = 'All Auctions (' + filtered.length + ')';
  } else {
    const w = weeks.find(w => w.monday === val);
    listTitle.textContent = w ? w.label + ' (' + filtered.length + ')' : 'Filtered (' + filtered.length + ')';
  }
  countInfo.textContent = filtered.length + ' of ' + auctions.length + ' mapped';

  if (bounds.length) map.fitBounds(bounds, {padding: [40, 40]});
  else map.setView([30.4213, -87.2169], 11);
}

function toggleList() {
  document.getElementById('list-wrap').classList.toggle('collapsed');
}

// Initial render
filterWeek();

// Auto-collapse list on mobile after initial load
if (window.innerWidth < 640) {
  setTimeout(() => document.getElementById('list-wrap').classList.add('collapsed'), 2000);
}
</script>
</body></html>
