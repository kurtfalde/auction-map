<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escambia Auction Map — 2026-06-26 to 2026-07-06</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif} .top{position:absolute;z-index:999;left:10px;right:10px;top:10px;background:#fff;padding:10px 12px;border-radius:12px;box-shadow:0 2px 12px #0002;max-width:760px} .top h1{font-size:16px;margin:0 0 4px} .top p{font-size:12px;margin:0;color:#444} .popup b{font-size:14px} .popup a{display:inline-block;margin:4px 8px 0 0} .list{position:absolute;z-index:998;right:10px;bottom:18px;max-height:38%;width:min(440px,calc(100vw - 20px));overflow:auto;background:#fff;border-radius:12px;box-shadow:0 2px 12px #0002;padding:8px} .item{padding:8px;border-bottom:1px solid #eee;font-size:13px;cursor:pointer} .item:last-child{border-bottom:0} .item:hover{background:#f4f7fb} @media(max-width:650px){.list{left:10px;right:10px;width:auto;max-height:32%}.top{font-size:12px}}
</style></head><body><div id="map"></div><div class="top"><h1>Escambia Auction Map — 2026-06-26 to 2026-07-06</h1><p>0 of 0 auctions mapped. Generated 2026-06-26 09:00:40 CDT. Tap pins/list items for links.</p></div><div class="list" id="list"></div>
<script>
const auctions = [];
const map = L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const bounds = [], markers = [];
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
auctions.forEach((a,i) => {
  const m = L.marker([a.lat, a.lon]).addTo(map); bounds.push([a.lat, a.lon]); markers.push(m);
  const popup = `<div class="popup"><b>${esc(a.address)}</b><br>${esc(a.auction_date)} ${esc(a.auction_time)}<br>Case: ${esc(a.case_number)}<br>Parcel: ${esc(a.parcel_id)}<br>Judgment: ${esc(a.judgment)}<br>Assessed: ${esc(a.assessed_value)}<br><small>Geocode: ${esc(a.geocode_source)}</small><br><a target="_blank" href="${a.detail_url}">Auction</a><a target="_blank" href="${a.appraiser_url}">Appraiser</a><a target="_blank" href="${a.google_url}">Google Maps</a><a target="_blank" href="${a.zillow_url}">Zillow</a></div>`;
  m.bindPopup(popup);
});
if (bounds.length) map.fitBounds(bounds, {padding:[40,40]}); else map.setView([30.4213,-87.2169], 11);
const list = document.getElementById('list');
auctions.sort((a,b) => (a.auction_date+a.auction_time+a.address).localeCompare(b.auction_date+b.auction_time+b.address)).forEach((a) => {
  const i = markers.findIndex(m => m.getLatLng().lat === a.lat && m.getLatLng().lng === a.lon);
  const d = document.createElement('div'); d.className = 'item';
  d.innerHTML = `<b>${esc(a.auction_date)}</b> — ${esc(a.address)}<br><span>${esc(a.judgment)} / assessed ${esc(a.assessed_value)}</span>`;
  d.onclick = () => { map.setView([a.lat, a.lon], 16); if (markers[i]) markers[i].openPopup(); };
  list.appendChild(d);
});
</script></body></html>
